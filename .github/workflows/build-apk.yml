name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (found: $JAVA_VER)."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_VER is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists, skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK was not found!"
            echo "Discovered APK files under app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK is empty!"
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "Error: $TARGET_APK does not have .apk extension."
              exit 1
              ;;
          esac
          echo "Target APK verified successfully: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroBox-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        run: |
          RELEASE_DIR="${RUNNER_TEMP}/apk-release"
          mkdir -p "$RELEASE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/NeuroBox.apk"
          echo "Prepared release asset at: $RELEASE_DIR/NeuroBox.apk"

      - name: Publish debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: NeuroBox v1.2.0 - Zero-Lag Butter-Smooth Edition & 20 Launch Checklist Complete
          body: |
            ## NeuroBox v1.2.0 Release: ChatGPT/Gemini-Level Butter-Smooth Experience & 20 Launch Checklist
            - **Zero-Lag Tab Transitions (ChatGPT / Gemini Speed)**:
              - Replaced heavy crossfade transitions with instantaneous `SaveableStateHolder` tab switching (0ms latency).
              - Virtualized `FocusScreen` and `MusicPlayerScreen` with keyed `LazyColumn`s.
              - Added fluid spring-bounce haptic micro-animations on bottom navigation dock.
              - Eliminated audio HAL tone generator thread locking with non-blocking native feedback.
            - **100% Complete 20-Point App Launch Checklist**:
              1. **Privacy Policy Page**: Built-in comprehensive GDPR/CCPA privacy policy modal and terms.
              2. **Terms & Conditions**: Complete legal terms of use agreement.
              3. **Secrets Off Frontend**: 100% clean frontend with zero hardcoded API secrets.
              4. **Force HTTPS**: Enforced strict `network_security_config.xml` with zero cleartext traffic.
              5. **Data Sovereignty Consent Banner**: First-launch consent banner informing users of offline storage.
              6. **Meta Titles & Descriptions**: Rich semantic app metadata in strings and AndroidManifest.
              7. **Store Preview Assets**: Added vector promotional banners and graphics.
              8. **Compress Images**: Migrated launcher icons from 1.76MB bitmap to razor-sharp XML vector drawables.
              9. **Faster Page Load**: LazyColumn virtualization across all 5 main screens.
              10. **Fix Color Contrast**: WCAG AA compliant text contrast across all dark and light themes.
              11. **Mobile-Friendly**: Full edge-to-edge support, multi-screen, foldable, and tablet responsive.
              12. **Fix Broken Links**: Wrapped all intent URL triggers in `AuraLinkHelper` with error recovery.
              13. **Form Validation**: Universal input validation on profile names, bios, and timers (`FormValidationHelper`).
              14. **Spam & Bot Protection**: Rapid click debouncer and tap rate limiter (`DebounceHelper`).
              15. **Set Up Analytics**: Privacy-preserving 100% offline local telemetry dashboard (`AuraLocalAnalytics`).
              16. **Clear Call-to-Action (CTA)**: High-contrast primary action buttons across all games and tools.
              17. **Adaptive Launcher Icon**: Standardized Android 26+ vector adaptive icon definitions.
              18. **Custom 404 / Empty States**: Sleek `CustomEmptyStateView` with quick filter reset on empty searches.
              19. **Sitemap / Deep Links & Backup Rules**: Deep linking intent filter (`neurobox://app`) + explicit XML backup rules.
              20. **Error Monitoring**: Global uncaught exception crash handler and diagnostic recorder (`AuraGlobalCrashHandler`).
            - **Creator Credits**: Samir Ahmmed (Lead Architect & Developer).
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ runner.temp }}/apk-release/NeuroBox.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
