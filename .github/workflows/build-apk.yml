name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (found: $JAVA_VER)."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_VER is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists, skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK was not found!"
            echo "Discovered APK files under app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK is empty!"
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "Error: $TARGET_APK does not have .apk extension."
              exit 1
              ;;
          esac
          echo "Target APK verified successfully: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        run: |
          RELEASE_DIR="${RUNNER_TEMP}/apk-release"
          mkdir -p "$RELEASE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/app-debug.apk"
          echo "Prepared release asset at: $RELEASE_DIR/app-debug.apk"

      - name: Publish debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Debug APK
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ runner.temp }}/apk-release/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
