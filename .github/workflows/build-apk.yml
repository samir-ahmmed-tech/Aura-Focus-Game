name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (found: $JAVA_VER)."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_VER is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists, skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK was not found!"
            echo "Discovered APK files under app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK is empty!"
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "Error: $TARGET_APK does not have .apk extension."
              exit 1
              ;;
          esac
          echo "Target APK verified successfully: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroBox-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        run: |
          RELEASE_DIR="${RUNNER_TEMP}/apk-release"
          mkdir -p "$RELEASE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/NeuroBox.apk"
          echo "Prepared release asset at: $RELEASE_DIR/NeuroBox.apk"

      - name: Publish debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: NeuroBox v1.1.0 - Ultra-Smooth High Performance Edition
          body: |
            ## NeuroBox v1.1.0 Release
            - **120 FPS Butter-Smooth Lazy Virtualization**: Completely eliminated screen transition lag by transitioning all game, tool, and setting screens to LazyColumn with keyed virtualization.
            - **40 Master Brain Games (16 Brand New Games Added)**:
              - Quantum Color Clash (g27)
              - Pattern Logic Matrix (g28)
              - Visual Saccade Sprint (g29)
              - Dual Switch Odd/Even (g30)
              - Spatial 3D Rotation (g31)
              - Echo Rhythm Simon (g32)
              - Time Estimation Pulse (g33)
              - Anagram Chain Rush (g34)
              - Go / No-Go Inhibit (g35)
              - Symbol Odyssey Cipher (g36)
              - Peripheral Radar (g37)
              - Synapse Math Chains (g38)
              - Labyrinth Pathfinder (g39)
              - Chrono Digit Matrix (g40)
              - Pitch Discrimination (g41)
              - Kinetic Orb Balancing (g42)
            - **35 Power Productivity Suite Tools (15 Brand New Tools Added)**:
              - 5-4-3-2-1 Sensory Grounding (t21)
              - Pomodoro Flow Architect (t22)
              - Circadian Energy Audit (t23)
              - Deep Work Ratio Tracker (t24)
              - Gratitude Pebble Jar (t25)
              - Vision Manifesto Board (t26)
              - Mental Clarity Brain Dump (t27)
              - Ivy Lee 6 Priorities Discipline (t28)
              - 20-20-20 Ocular Relief Pacer (t29)
              - Multi-Spectrum Noise Synthesizer (t30)
              - CBT Cognitive Reframing Matrix (t31)
              - Hydration Metabolism Pacer (t32)
              - Weekly Agile Retrospective (t33)
              - Focus Commitment Contract (t34)
              - Desk Ergonomics & Posture Pacer (t35)
            - **Developer Showcase**: Samir Ahmmed (Lead Architect & Developer) with direct GitHub repo linkage.
            - **In-App GitHub Release Update Checker**: Built-in update engine checking GitHub Releases with 1-tap download.
            - **Play Store Compliance & Privacy Sovereignty**: Complete offline privacy policy, terms of service, and 1-tap full data erasure.
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ runner.temp }}/apk-release/NeuroBox.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
