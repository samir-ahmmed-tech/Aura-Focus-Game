name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (found: $JAVA_VER)."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_VER is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists, skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK was not found!"
            echo "Discovered APK files under app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK is empty!"
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "Error: $TARGET_APK does not have .apk extension."
              exit 1
              ;;
          esac
          echo "Target APK verified successfully: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroBox-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        run: |
          RELEASE_DIR="${RUNNER_TEMP}/apk-release"
          mkdir -p "$RELEASE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/NeuroBox.apk"
          echo "Prepared release asset at: $RELEASE_DIR/NeuroBox.apk"

      - name: Publish debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: NeuroBox v1.3.0 - 50 Master Brain Games & 45 Power Productivity Tools
          body: |
            ## NeuroBox v1.3.0 Release: 50 Master Brain Games, 45 Power Productivity Tools & Zero-Lag Architecture
            - **10 Brand New High-Cognitive Brain Games (Total 50 Master Games)**:
              - `g43` Quantum Mirror Entanglement: Mirror-spin pattern symmetry detector.
              - `g44` Dual Conflict Color Clash: Double-conflict text vs ink decision test.
              - `g45` Reverse Digit Span Recall: WAIS working memory backward manipulation.
              - `g46` Mental Origami Hole Punch: Visuospatial fold projection & hole punch prediction.
              - `g47` Color Pulse Rhythm Sync: Sub-50ms beat concentric pulse synchronizer.
              - `g48` Tower of Hanoi Flow: Executive sequence planning and minimal move optimizer.
              - `g49` Lexical Anomaly Hunt: High-speed semantic cluster outlier detector.
              - `g50` Synapse Circuit Router: 3x3 rotating tile electrical pathway aligner.
              - `g51` Microtone Interval Calibrator: Acoustic micro-tonal ear discriminator.
              - `g52` Peripheral Anomaly Scanner: Subtle change blindness flicker scanner.
            - **10 Brand New Power Productivity Tools (Total 45 Power Tools)**:
              - `t36` Parkinson's Law Sprint: Micro-sprint countdown enforcer restricting task inflation.
              - `t37` Rubber Duck Cognitive Debugger: Socratic lateral blocker solver canvas.
              - `t38` Energy-Drainer & Burnout Radar: 5-factor vitality friction & recovery audit.
              - `t39` Mental Rehearsal Visualizer: 4-stage pre-performance neural imagery script.
              - `t40` Interstitial Journaling Timer: Zero-lag transition bridge between work blocks.
              - `t41` Feynman Technique Clarifier: Plain-English deep mastery concept breakdown.
              - `t42` Decision Matrix & Weighted Scorer: Multi-factor weighted prioritization grid.
              - `t43` Digital Sunset Wind-Down: 4-step circadian evening cognitive shutdown.
              - `t44` Anti-Procrastination 5-Min Kickstart: Low-friction momentum trigger.
              - `t45` Weekly OKR & Retrospective Matrix: Objectives & Key Results weekly alignment.
            - **Zero-Lag Butter-Smooth Architecture**:
              - Instantaneous 0ms tab switching with `SaveableStateHolder`.
              - 120 FPS LazyColumn virtualization across all screens.
              - Non-blocking native haptic feedback on tab changes.
            - **Developer Credits**: Samir Ahmmed (Lead Architect & Developer).
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ runner.temp }}/apk-release/NeuroBox.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
